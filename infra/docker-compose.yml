services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scene404
      POSTGRES_PASSWORD: scene404
      POSTGRES_DB: scene404
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scene404 -d scene404"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
